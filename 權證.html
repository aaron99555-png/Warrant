        }

        .option-btn.wrong {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .next-btn {
            background-color: var(--primary-color);

        {

        {

            options: ["1倍", "2-3倍", "3-15倍甚至更高", "100倍"],
            a: 2,

        {

            options: ["適合，沒人搶", "不適合，標的難進出，權證更難進出（甚至券商會拉大價差）", "沒差", "適合長抱"],
            a: 1,
            explain: "標的流動性差，發行商避險困難，通常會拉大權證的買賣價差或降低掛單量，不適合操作。"
        },
        {
            q: "小哥建議每檔權證投入的資金不要超過總資金的多少？",
            options: ["100% (All in)", "50%", "10%", "0%"],
            a: 2,

        {

            options: ["一樣", "不一樣，最後交易日通常在到期日前2個交易日", "最後交易日比到期日晚", "看心情"],

        {

        {

            a: 1,
            explain: "股票期貨的交易成本極低（稅十萬分之二），且無時間價值流失問題，是除權息操作的另一利器。"

        {

            a: 1,
            explain: "統計過去歷史數據（除息當天是否開高、填息機率）是提高勝率的關鍵。"

            a: 1,
            explain: "若是「隔日沖主力」大買權證，隔天開高通常會直接倒貨，造成權證與現股殺盤，要避開或跟著做空/賣出。"

        {
            q: "關於「價差比」公式，下列何者正確？",
            options: ["(委賣-委買)/委賣", "(委賣-委買)/成交價", "(委買-委賣)/委買", "委賣/委買"],
            a: 0,
            explain: "價差比 = (委賣價 - 委買價) / 委賣價。分母越大或分子越小，價差比越低。"
        },
        {
            q: "權證小哥是哪一家理財軟體的合作作者？",
            options: ["CMoney 理財寶", "Yahoo股市", "PChome", "Google"],
            a: 0,
            explain: "講義與檔案皆來自 CMoney 理財寶。"
        }
    ];

    // 如果要補到100題，可以在這裡繼續添加...
    // 範例：
    // questionBank.push({ q: "題目...", options: ["A", "B"], a: 0, explain: "..." });

    let currentQuestion = 0;
    let score = 0;
    let userAnswers = [];

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const nextBtn = document.getElementById('next-btn');
    const scoreDisplay = document.getElementById('score');
    const currentQNum = document.getElementById('current-question-num');
    const totalQNum = document.getElementById('total-questions');
    const progressBar = document.getElementById('progress-fill');
    const explanationDiv = document.getElementById('explanation');
    const quizArea = document.getElementById('quiz-area');
    const resultScreen = document.getElementById('result-screen');
    const finalScore = document.getElementById('final-score');
    const feedbackText = document.getElementById('feedback-text');

    totalQNum.textContent = questionBank.length;

    function loadQuestion() {
        const qData = questionBank[currentQuestion];
        questionText.textContent = `${currentQuestion + 1}. ${qData.q}`;
        currentQNum.textContent = currentQuestion + 1;
        
        // Update Progress
        const progress = ((currentQuestion) / questionBank.length) * 100;
        progressBar.style.width = `${progress}%`;

        optionsContainer.innerHTML = '';
        explanationDiv.style.display = 'none';
        nextBtn.style.display = 'none';

        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedIndex, btn) {
        const qData = questionBank[currentQuestion];
        const buttons = optionsContainer.getElementsByClassName('option-btn');
        
        // Disable all buttons
        for(let b of buttons) {
            b.disabled = true;
        }

        if(selectedIndex === qData.a) {
            btn.classList.add('correct');
            score += 2; // 假設每題2分，或根據題目數調整
            scoreDisplay.textContent = score;
        } else {
            btn.classList.add('wrong');
            buttons[qData.a].classList.add('correct');
        }

        // Show Explanation
        explanationDiv.textContent = `💡 解析：${qData.explain}`;
        explanationDiv.style.display = 'block';

        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestion++;
        if(currentQuestion < questionBank.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        quizArea.style.display = 'none';
        resultScreen.style.display = 'block';
        finalScore.textContent = score;
        
        let msg = "";
        if(score >= 90) msg = "太神啦！你是權證大師吧！";
        else if(score >= 70) msg = "不錯喔！基本觀念很紮實。";
        else if(score >= 50) msg = "還可以，建議多複習小哥的講義。";
        else msg = "加油！建議先把小哥的6大原則再看一遍。";
        
        feedbackText.textContent = msg;
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        scoreDisplay.textContent = 0;
        resultScreen.style.display = 'none';
        quizArea.style.display = 'block';
        loadQuestion();
    }

    // Start
    loadQuestion();

</script>
