        function RyanStockJournal() {
            // --- State ---
            const [logs, setLogs] = useState(() => {
                const saved = localStorage.getItem('ryan_stock_logs');
                return saved ? JSON.parse(saved) : [];
            });
            const [customStocks, setCustomStocks] = useState(() => {
                const saved = localStorage.getItem('ryan_custom_stocks');
                return saved ? JSON.parse(saved) : {};
            });
            const [filterStrategy, setFilterStrategy] = useState([]);
            const [strictMode, setStrictMode] = useState(false);
            const [showInventoryOnly, setShowInventoryOnly] = useState(false);
            const [activeTab, setActiveTab] = useState('journal');

            const today = new Date().toISOString().split('T')[0];
            const fileInputRef = useRef(null);
            const editorTopRef = useRef(null);

            // Input Form State
            const [inputDate, setInputDate] = useState(today);
            const [inputCode, setInputCode] = useState('');
            const [inputName, setInputName] = useState('');
            const [inputIndustry, setInputIndustry] = useState('');
            const [selectedStrategies, setSelectedStrategies] = useState([STRATEGIES[0]]);
            
            // Search Suggestions State
            const [suggestions, setSuggestions] = useState([]);
            const [showSuggestions, setShowSuggestions] = useState(false);

            // Add Custom Stock Modal State
            const [showAddStockModal, setShowAddStockModal] = useState(false);
            const [newStockCode, setNewStockCode] = useState('');
            const [newStockName, setNewStockName] = useState('');
            const [newStockIndustry, setNewStockIndustry] = useState('');

            // Trade Plan Calculator State (Stock)
            const [editingId, setEditingId] = useState(null);
            const [planDate, setPlanDate] = useState(today);
            const [planCode, setPlanCode] = useState('');
            const [planName, setPlanName] = useState('');
            const [planEntry, setPlanEntry] = useState('');
            const [planStopLoss, setPlanStopLoss] = useState('');
            const [planTakeProfit, setPlanTakeProfit] = useState('');
            const [planExit, setPlanExit] = useState('');
            const [planQty, setPlanQty] = useState(0); 
            const [planReason, setPlanReason] = useState(''); 
            const [planStatus, setPlanStatus] = useState('planning'); 
            const [planInStock, setPlanInStock] = useState(false); 

            // Trade Plan Calculator State (Warrant)
            const [planWarrantCode, setPlanWarrantCode] = useState('');
            const [planWarrantNote, setPlanWarrantNote] = useState('');
            const [planWarrantEntry, setPlanWarrantEntry] = useState('');
            const [planWarrantExit, setPlanWarrantExit] = useState('');
            const [planWarrantQty, setPlanWarrantQty] = useState('');

            // Filter & Sort State
            const [filterStartDate, setFilterStartDate] = useState(today);
            const [filterEndDate, setFilterEndDate] = useState(today);
            const [showTrackedOnly, setShowTrackedOnly] = useState(false);
            const [sortConfig, setSortConfig] = useState({ key: 'date', direction: 'desc' });
            
            // Plan Stats Date Range - Default to Today
            const [statsStartDate, setStatsStartDate] = useState(today); 
            const [statsEndDate, setStatsEndDate] = useState(today);

            // Toast & Modal State
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState({ show: false, title: '', message: '', onConfirm: () => {} });

            // --- Effects ---
            useEffect(() => {
                localStorage.setItem('ryan_stock_logs', JSON.stringify(logs));
            }, [logs]);

            useEffect(() => {
                localStorage.setItem('ryan_custom_stocks', JSON.stringify(customStocks));
            }, [customStocks]);

            useEffect(() => {
                if (toast) {
                    const timer = setTimeout(() => setToast(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [toast]);

            const stockMap = useMemo(() => {
                return { ...STATIC_STOCK_DB, ...customStocks };
            }, [customStocks]);

            const handleCodeChange = (e) => {
                const val = e.target.value;
                setInputCode(val);
                
                if (!val) {
                    setSuggestions([]);
                    setShowSuggestions(false);
                    return;
                }

                const matches = [];
                for (const [code, data] of Object.entries(stockMap)) {
                    if (code.startsWith(val) || data.name.includes(val)) {
                        matches.push({ code, ...data });
                    }
                    if (matches.length >= 8) break; 
                }
                setSuggestions(matches);
                setShowSuggestions(true);
            };

            const selectSuggestion = (stock) => {
                setInputCode(stock.code);
                setSuggestions([]);
                setShowSuggestions(false);
            };

            useEffect(() => {
                if (stockMap[inputCode]) {
                    setInputName(stockMap[inputCode].name);
                    setInputIndustry(stockMap[inputCode].industry);
                } else if (inputCode.length >= 4) {
                    setInputName('無該檔股票資訊');
                    setInputIndustry('');
                } else {
                    setInputName('');
                    setInputIndustry('');
                }
            }, [inputCode, stockMap]);

            useEffect(() => {
                if (stockMap[planCode]) {
                    setPlanName(stockMap[planCode].name);
                    setPlanWarrantNote(stockMap[planCode].name);
                } else if (planCode.length >= 4) {
                    setPlanName('無資訊');
                    setPlanWarrantNote(planCode);
                } else {
                    setPlanName('');
                    setPlanWarrantNote('');
                }
            }, [planCode, stockMap]);
            
            useEffect(() => {
                if (confirmModal.show) {
                    const handleKeyDown = (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            confirmModal.onConfirm();
                        } else if (e.key === 'Escape') {
                            setConfirmModal(prev => ({ ...prev, show: false }));
                        }
                    };
                    window.addEventListener('keydown', handleKeyDown);
                    return () => window.removeEventListener('keydown', handleKeyDown);
                }
            }, [confirmModal]);

            const showToast = (type, message) => {
                setToast({ type, message });
            };

            // 修改：選擇條件改為「單選」
            const toggleStrategy = (strat) => {
                setSelectedStrategies([strat]);
            };

            // 修改：連動邏輯配合單選模式
            const toggleFilterStrategy = (label) => {
                setFilterStrategy(prev => {
                    let newFilters;
                    if (prev.includes(label)) {
                        newFilters = prev.filter(l => l !== label);
                    } else {
                        newFilters = [...prev, label];
                    }

                    // 連動：將左側「選擇條件」設定為目前點擊的這個條件 (保持單選)
                    const targetStrategy = STRATEGIES.find(s => s.label === label);
                    if (targetStrategy) {
                        setSelectedStrategies([targetStrategy]);
                    }

                    return newFilters;
                });
            };

            const handleAddCustomStock = () => {
                if (!newStockCode || !newStockName) {
                    showToast('error', '請輸入代號與名稱');
                    return;
                }
                
                setCustomStocks(prev => ({
                    ...prev,
                    [newStockCode]: { name: newStockName, industry: newStockIndustry }
                }));
                
                setNewStockCode('');
                setNewStockName('');
                setNewStockIndustry('');
                showToast('success', `已新增股票：${newStockName} (${newStockCode})`);
            };

            const handleDeleteCustomStock = (code) => {
                const newCustom = { ...customStocks };
                delete newCustom[code];
                setCustomStocks(newCustom);
                showToast('success', `已刪除自訂股票：${code}`);
            };

            const handleEntryChange = (e) => {
                const val = e.target.value;
                setPlanEntry(val);
                if (val && !isNaN(val)) {
                    const sl = (parseFloat(val) * 0.95).toFixed(1); 
                    setPlanStopLoss(sl);
                } else {
                    setPlanStopLoss('');
                }
            };

            // Modified to handle overrideData
            const handleAddStock = (e, overrideData = null) => {
                if (e && e.preventDefault) e.preventDefault();
                
                const targetCode = overrideData ? overrideData.code : inputCode;
                const targetName = overrideData ? overrideData.name : inputName;
                const targetIndustry = overrideData ? overrideData.industry : inputIndustry;

                if (targetName === '無該檔股票資訊') {
                    showToast('error', "請輸入正確的股票名稱，或使用「新增股號」功能加入資料庫。");
                    return;
                }

                if (!targetCode || !targetName || selectedStrategies.length === 0) {
                    showToast('error', "請填寫股票代號並至少選擇一個條件");
                    return; 
                }

                let addedCount = 0;
                const newLogs = [];

                selectedStrategies.forEach(strat => {
                    const exists = logs.some(log => 
                        log.date === inputDate && 
                        log.code === targetCode && 
                        log.strategyId === strat.id
                    );

                    if (!exists) {
                        newLogs.push({
                            id: Date.now() + Math.random(),
                            date: inputDate,
                            code: targetCode,
                            name: targetName,
                            industry: targetIndustry,
                            strategyId: strat.id,
                            strategyLabel: strat.label,
                            isTracked: false,
                        });
                        addedCount++;
                    }
                });

                if (addedCount > 0) {
                    setLogs([...newLogs, ...logs]);
                    showToast('success', `已新增 ${targetName} - ${addedCount} 個條件標記`);
                    setInputCode('');
                    setInputName('');
                    setInputIndustry('');
                    document.getElementById('stock-code-input').focus();
                } else {
                    showToast('error', "所選條件皆已存在於該日期的紀錄中");
                    setInputCode('');
                    setInputName('');
                    setInputIndustry('');
                }
            };

            // Enhanced KeyDown Handler for Input
            const handleInputKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (suggestions.length > 0) {
                        // Automatically select the first suggestion
                        const firstMatch = suggestions[0];
                        // Update state for UI consistency (though handleAddStock uses override)
                        setInputCode(firstMatch.code);
                        // Call Add Stock directly with the suggestion data
                        handleAddStock(e, firstMatch);
                        // Close suggestions
                        setSuggestions([]);
                        setShowSuggestions(false);
                    } else {
                        // Fallback to normal behavior if no suggestions
                        handleAddStock(e);
                    }
                }
            };
            
            const handleSavePlan = () => {
                if (!planCode) {
                    showToast('error', '請輸入股票代號');
                    return;
                }
                
                const planData = {
                    date: planDate, 
                    code: planCode,
                    name: planName || '未知',
                    industry: stockMap[planCode]?.industry || '', 
                    entry: planEntry,
                    stopLoss: planStopLoss,
                    takeProfit: planTakeProfit,
                    exit: planExit,
                    qty: planQty, 
                    reason: planReason, 
                    planStatus: planStatus,
                    inStock: planInStock,
                    warrantCode: planWarrantCode,
                    warrantNote: planWarrantNote,
                    warrantEntry: planWarrantEntry,
                    warrantExit: planWarrantExit,
                    warrantQty: planWarrantQty,
                    currentPrice: '' 
                };

                if (editingId) {
                    setLogs(prevLogs => prevLogs.map(log => 
                        log.id === editingId ? { ...log, ...planData, currentPrice: log.currentPrice, warrantCurrentPrice: log.warrantCurrentPrice } : log
                    ));
                    showToast('success', '交易規劃已更新');
                    setEditingId(null); 
                    clearPlanForm(); 
                } else {
                    const isDuplicate = logs.some(log => 
                        log.date === planDate && 
                        log.code === planCode && 
                        (log.warrantCode || '') === (planWarrantCode || '')
                    );

                    if (isDuplicate) {
                        setConfirmModal({
                            show: true,
                            title: '重複紀錄',
                            message: '該日期已存在相同股票與權證代號的紀錄。是否要強制新增一筆？(若要修改請使用列表右側的編輯按鈕)',
                            onConfirm: () => {
                                createNewPlan(planData);
                                setConfirmModal({ show: false });
                            }
                        });
                    } else {
                        createNewPlan(planData);
                    }
                }
            };

            const handleUpdateLogField = (id, field, value) => {
                setLogs(prevLogs => prevLogs.map(log => 
                    log.id === id ? { ...log, [field]: value } : log
                ));
            };

            const createNewPlan = (data) => {
                 const newLog = {
                    id: Date.now() + Math.random(),
                    strategyId: 'custom_plan', 
                    strategyLabel: '自訂規劃',
                    isTracked: true,
                    ...data
                };
                setLogs([newLog, ...logs]);
                showToast('success', '新交易規劃已建立');
                clearPlanForm();
            };

            const clearPlanForm = () => {
                setEditingId(null);
                setPlanCode('');
                setPlanName('');
                setPlanEntry('');
                setPlanStopLoss('');
                setPlanTakeProfit('');
                setPlanExit('');
                setPlanQty(0);
                setPlanReason('');
                setPlanStatus('planning');
                setPlanInStock(false);
                setPlanWarrantCode('');
                setPlanWarrantNote('');
                setPlanWarrantEntry('');
                setPlanWarrantExit('');
                setPlanWarrantQty('');
            };

            const handleDateRangeSelect = (e) => {
                const days = parseInt(e.target.value);
                if (!days) return; 

                const end = new Date(); 
                const start = new Date();
                start.setDate(end.getDate() - days + 1); 

                setFilterEndDate(end.toISOString().split('T')[0]);
                setFilterStartDate(start.toISOString().split('T')[0]);
            };

            const handleDeleteLog = (id) => {
                setLogs(currentLogs => currentLogs.filter(log => log.id !== id));
            };

            const handleDeleteGroup = (date, code) => {
                setConfirmModal({
                    show: true,
                    title: '確認刪除',
                    message: `確定要刪除 ${date} ${code} 的所有紀錄嗎？`,
                    onConfirm: () => {
                        setLogs(currentLogs => currentLogs.filter(log => !(log.date === date && log.code === code)));
                        showToast('success', '已刪除紀錄');
                        setConfirmModal({ show: false });
                    }
                });
            };

            const handleToggleTrackGroup = (date, code, currentStatus) => {
                setLogs(logs.map(log => {
                    if (log.date === date && log.code === code) {
                        return { ...log, isTracked: !currentStatus };
                    }
                    return log;
                }));
            };

            const handleSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') {
                    direction = 'desc';
                }
                setSortConfig({ key, direction });
            };

            const handleExport = () => {
                try {
                    const dataToExport = logs.map(log => ({
                        id: log.id,
                        date: log.date,
                        code: log.code ? String(log.code) : '', 
                        name: log.name,
                        industry: log.industry,
                        strategyId: log.strategyId,
                        strategyLabel: log.strategyLabel,
                        isTracked: log.isTracked ? true : false, 
                        entry: log.entry ? String(log.entry) : '',
                        stopLoss: log.stopLoss ? String(log.stopLoss) : '',
                        takeProfit: log.takeProfit ? String(log.takeProfit) : '',
                        exit: log.exit ? String(log.exit) : '',
                        qty: log.qty ? String(log.qty) : '0',
                        reason: log.reason || '',
                        planStatus: log.planStatus || 'planning',
                        inStock: log.inStock ? true : false,
                        warrantCode: log.warrantCode ? String(log.warrantCode) : '',
                        warrantNote: log.warrantNote || '',
                        warrantEntry: log.warrantEntry ? String(log.warrantEntry) : '',
                        warrantExit: log.warrantExit ? String(log.warrantExit) : '',
                        warrantQty: log.warrantQty ? String(log.warrantQty) : '',
                        currentPrice: log.currentPrice ? String(log.currentPrice) : '',
                        warrantCurrentPrice: log.warrantCurrentPrice ? String(log.warrantCurrentPrice) : ''
                    }));

                    const ws = XLSX.utils.json_to_sheet(dataToExport);

            const planStats = useMemo(() => {
                let totalTrades = 0;
                let closedTrades = 0;
                let winCount = 0;
                let totalROI = 0;
                let totalProfitAmount = 0;

                logs.forEach(log => {
                    if (!log.entry && !log.warrantCode) return;
                    if (log.date < statsStartDate || log.date > statsEndDate) return;

                    totalTrades++;

                    // --- Stock Logic ---
                    let stockProfit = 0;
                    let hasStockTrade = false;
                    
                    const entry = log.entry ? parseFloat(log.entry) : 0;
                    const exit = log.exit ? parseFloat(log.exit) : null;
                    const current = log.currentPrice ? parseFloat(log.currentPrice) : null;
                    const qty = parseFloat(log.qty || 0);
                    const sl = log.stopLoss ? parseFloat(log.stopLoss) : 0;
                    const isShort = sl > entry; 

                    if (entry > 0) {
                        if (exit !== null) {
                            stockProfit = isShort ? (entry - exit) * 1000 * qty : (exit - entry) * 1000 * qty;
                            hasStockTrade = true;
                        } else if (current !== null) {
                            stockProfit = isShort ? (entry - current) * 1000 * qty : (current - entry) * 1000 * qty;
                            hasStockTrade = true;
                        }
                    }

                    // --- Warrant Logic ---
                    let warrantProfit = 0;
                    let hasWarrantTrade = false;
                    
                    const warrantEntry = log.warrantEntry ? parseFloat(log.warrantEntry) : 0;
                    const warrantExit = log.warrantExit ? parseFloat(log.warrantExit) : null;
                    const warrantCurrent = log.warrantCurrentPrice ? parseFloat(log.warrantCurrentPrice) : null;
                    const warrantQty = parseFloat(log.warrantQty || 0);

                    if (warrantEntry > 0 && warrantQty > 0) {
                        if (warrantExit !== null) {
                            warrantProfit = (warrantExit - warrantEntry) * 1000 * warrantQty;
                            hasWarrantTrade = true;
                        } else if (warrantCurrent !== null) {
                            warrantProfit = (warrantCurrent - warrantEntry) * 1000 * warrantQty;
                            hasWarrantTrade = true;
                        }
                    }

                    // --- Aggregation ---
                    if (hasStockTrade || hasWarrantTrade) {
                        const tradeTotalProfit = stockProfit + warrantProfit;
                        totalProfitAmount += tradeTotalProfit;
                        closedTrades++; // Counting active/closed trades with calculate-able profit

                        // ROI Calculation (Simplified: based on Stock entry only if available, or just direction of profit)
                        // If trade made money > 0, it's a win
                        if (tradeTotalProfit > 0) winCount++;

                        // ROI is tricky with mixed stock/warrant. 
                        // Simplified: use stock ROI if available, else 0 or approximation
                        let tradeROI = 0;
                        if (entry > 0 && (exit !== null || current !== null)) {
                             // Use standard stock ROI formula
                             const endPrice = exit !== null ? exit : current;
                             if (isShort) {
                                tradeROI = ((entry - endPrice) / entry) * 100;
                             } else {
                                tradeROI = ((endPrice - entry) / entry) * 100;
                             }
                        }
                        totalROI += tradeROI;
                    }
                });

                const winRate = closedTrades > 0 ? ((winCount / closedTrades) * 100).toFixed(1) : 0;
                const avgROI = closedTrades > 0 ? (totalROI / closedTrades).toFixed(2) : 0;

                return {
                    totalTrades,
                    closedTrades,
                    winRate,
                    totalROI: totalROI.toFixed(2),
                    avgROI,
                    totalProfitAmount: Math.round(totalProfitAmount)
                };
            }, [logs, statsStartDate, statsEndDate]);

            // Base Logs & Display Logs
            const baseLogs = useMemo(() => {
                return logs.filter(log => {
                    const isCustomPlan = log.strategyId === 'custom_plan';
                    if (activeTab === 'journal' && isCustomPlan) return false;
                    
                    const dateMatch = log.date >= filterStartDate && log.date <= filterEndDate;
                    const trackMatch = showTrackedOnly ? log.isTracked : true;
                    return dateMatch && trackMatch;
                });
            }, [logs, filterStartDate, filterEndDate, showTrackedOnly, activeTab]);

            const logsWithPlans = useMemo(() => {
                 return logs.filter(log => {
                    const hasPlan = log.entry || log.stopLoss || log.takeProfit || log.strategyId === 'custom_plan' || log.warrantCode;
                    if (!hasPlan) return false;
                    const dateMatch = log.date >= filterStartDate && log.date <= filterEndDate;
                    // Filter by Inventory Only if checked
                    const inventoryMatch = showInventoryOnly ? log.inStock : true;

                    return dateMatch && inventoryMatch;
                });
            }, [logs, filterStartDate, filterEndDate, showInventoryOnly]); 

            const groupedRawLogs = useMemo(() => {
                const groups = {};
                baseLogs.forEach(log => {
                    const key = `${log.date}-${log.code}`;
                    if (!groups[key]) {
                        groups[key] = {
                            date: log.date,
                            code: log.code,
                            name: log.name,
                            industry: log.industry,
                            isTracked: log.isTracked,
                            strategies: [],
                            reason: log.reason,
                            inStock: log.inStock 
                        };
                    }
                    groups[key].strategies.push({
                        id: log.id,
                        strategyId: log.strategyId,
                        strategyLabel: log.strategyLabel
                    });
                });
                return Object.values(groups);
            }, [baseLogs]);

            const displayLogs = useMemo(() => {
                let result = groupedRawLogs;

                if (filterStrategy.length > 0) {
                    if (strictMode) {
                        result = result.filter(group => 
                            filterStrategy.every(f => 
                                group.strategies.some(s => s.strategyLabel === f)
                            )
                        );
                    } else {
                        result = result.filter(group => 
                            group.strategies.some(s => filterStrategy.includes(s.strategyLabel))
                        );
                    }
                }

                result.sort((a, b) => {
                    let valA = a[sortConfig.key];
                    let valB = b[sortConfig.key];

                    if (sortConfig.key === 'code') {
                        valA = parseInt(valA) || valA;
                        valB = parseInt(valB) || valB;
                    }

                    if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                return result;
            }, [groupedRawLogs, filterStrategy, sortConfig, strictMode]);

            // 【已修正】讓右側條件統計精準計算左邊畫面上剩餘的項目 (動態統計)
            const summaryStats = useMemo(() => {
                const stats = {};
                STRATEGIES.forEach(s => stats[s.label] = 0);
                displayLogs.forEach(group => {
                    group.strategies.forEach(strat => {
                        if (stats[strat.strategyLabel] !== undefined) {
                            stats[strat.strategyLabel]++;
                        }
                    });
                });
                return stats;
            }, [displayLogs]);

            const trackedCount = useMemo(() => {
                return displayLogs.filter(g => g.isTracked).length;
            }, [displayLogs]);

            // --- Renders ---
            const renderJournalView = () => (
                <section className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    {/* Left Column */}
                    <div className="lg:col-span-8 space-y-6">
                        {/* Add Stock Panel */}
                        <div className="bg-[#111827] rounded-xl shadow-xl border border-white/10 p-4 relative overflow-hidden group/panel hover:border-blue-500/30 transition-colors">
                            {/* ... Input Fields ... */}
                            <div className="absolute top-0 right-0 p-10 opacity-[0.03] group-hover/panel:opacity-[0.05] transition-opacity duration-700 pointer-events-none">
                                <TrendingUp size={200} />
                            </div>
                            <h2 className="text-lg font-bold mb-3 flex items-center gap-3 text-white relative z-10">
                                <div className="w-1.5 h-6 bg-gradient-to-b from-blue-400 to-indigo-600 rounded-full shadow-[0_0_15px_rgba(99,102,241,0.8)]"></div>
                                新增觀察個股
                            </h2>
                            <div className="space-y-5 relative z-10">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 mb-1.5 ml-1 uppercase tracking-wide">日期</label>
                                        <div className="date-input-wrapper">
                                            <input type="date" value={inputDate} onChange={(e) => setInputDate(e.target.value)} className="w-full px-4 py-3 bg-[#1F2937] border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-white font-medium text-sm transition-all shadow-inner cursor-pointer hover:bg-slate-800"/>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-300 mb-1.5 ml-1 uppercase tracking-wide">股票代碼 / 名稱</label>
                                        <div className="relative">
                                            <input 
                                                id="stock-code-input" 
                                                type="text" 
                                                placeholder="輸入代號或名稱 (如 2330 或 台積)" 
                                                value={inputCode} 
                                                onChange={handleCodeChange} 
                                                onFocus={() => inputCode && setShowSuggestions(true)}

                                                className="w-full px-4 py-3 bg-[#1F2937] border border-slate-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-white font-bold text-sm font-mono tracking-wide shadow-inner hover:bg-slate-800 placeholder:text-slate-600"
                                                autoComplete="off"
                                            />
                                            
                                            {/* 智慧搜尋下拉選單 */}
                                            {showSuggestions && suggestions.length > 0 && (
                                                <div className="absolute left-0 right-0 top-full mt-1 bg-[#1F2937] border border-slate-600 rounded-xl shadow-2xl z-50 max-h-60 overflow-y-auto custom-scrollbar">
                                                    {suggestions.map((s) => (

                                                    {inputName}

                                    </div>
                                </div>
                                <div className="grid grid-cols-2 gap-3">

                                <div>

                                    {/* 區塊 1：一般條件 */}

                                                    {isSelected && <div className="absolute inset-0 bg-white/10 mix-blend-overlay"></div>}
                                                    <Icon size={16} className={`relative z-10 ${isSelected ? 'animate-pulse' : ''}`}/>
                                                    <span className="relative z-10">{strat.label}</span>
                                                </button>
                                            );
                                        })}
                                    </div>

                                    {/* 區塊 2：籌碼集中度分析 */}
                                    <div className="pt-3 border-t border-slate-700/50 mb-4">
                                        <div className="text-[10px] font-bold text-sky-400 mb-2 ml-1 uppercase tracking-wider flex items-center gap-1">
                                            <Percent size={12} /> 籌碼集中度分析
                                        </div>
                                        <div className="flex flex-wrap gap-3">
                                            {STRATEGIES.filter(strat => strat.id.startsWith('chip_')).map((strat) => {
                                                const Icon = strat.icon;
                                                const isSelected = selectedStrategies.some(s => s.id === strat.id);
                                                return (
                                                    <button key={strat.id} onClick={() => toggleStrategy(strat)} className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold border transition-all duration-300 relative overflow-hidden group ${isSelected ? `${strat.color} ring-2 ring-white/20 scale-105 z-10 shadow-lg` : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-white hover:border-slate-500'}`}>
                                                        {isSelected && <div className="absolute inset-0 bg-white/10 mix-blend-overlay"></div>}
                                                        <Icon size={16} className={`relative z-10 ${isSelected ? 'animate-pulse' : ''}`}/>
                                                        <span className="relative z-10">{strat.label}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                    
                                    {/* 區塊 3：當沖專區 */}
                                    <div className="pt-3 border-t border-slate-700/50">
                                        <div className="text-[10px] font-bold text-amber-400 mb-2 ml-1 uppercase tracking-wider flex items-center gap-1">
                                            <Crosshair size={12} /> 當沖專區
                                        </div>
                                        <div className="flex flex-wrap gap-3">
                                            {STRATEGIES.filter(strat => strat.id.startsWith('day_trade_')).map((strat) => {
                                                const Icon = strat.icon;
                                                const isSelected = selectedStrategies.some(s => s.id === strat.id);
                                                return (
                                                    <button key={strat.id} onClick={() => toggleStrategy(strat)} className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold border transition-all duration-300 relative overflow-hidden group ${isSelected ? `${strat.color} ring-2 ring-white/20 scale-105 z-10 shadow-lg` : 'bg-slate-800/50 border-slate-700 text-slate-400 hover:bg-slate-700 hover:text-white hover:border-slate-500'}`}>
                                                        {isSelected && <div className="absolute inset-0 bg-white/10 mix-blend-overlay"></div>}
                                                        <Icon size={16} className={`relative z-10 ${isSelected ? 'animate-pulse' : ''}`}/>
                                                        <span className="relative z-10">{strat.label}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>

                                <button onClick={handleAddStock} className="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white font-bold tracking-widest py-2.5 rounded-lg shadow-[0_0_15px_rgba(139,92,246,0.5)] transition-all active:scale-[0.98] flex items-center justify-center gap-2 border border-white/20 text-sm group relative overflow-hidden mt-4">
                                    <span className="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700"></span>
                                    <Plus size={18} strokeWidth={3} className="group-hover:rotate-90 transition-transform duration-300"/> 加入日誌
                                </button>
                            </div>
                        </div>

                        {/* List */}
                        <div className="bg-[#111827] rounded-2xl shadow-2xl border border-white/10 overflow-hidden min-h-[400px]">
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[400px]">
                                    <thead>
                                        <tr className="bg-slate-900/80 text-blue-300 text-xs font-bold uppercase tracking-wider border-b border-white/10">
                                            <th className="py-4 px-6 w-32 cursor-pointer hover:text-white select-none transition-colors" onClick={() => handleSort('date')}><div className="flex items-center gap-1">日期{sortConfig.key === 'date' && <ArrowUpDown size={12} className="text-blue-500" />}</div></th>
                                            <th className="py-4 px-6 w-24 cursor-pointer hover:text-white select-none transition-colors" onClick={() => handleSort('code')}><div className="flex items-center gap-1">代號{sortConfig.key === 'code' && <ArrowUpDown size={12} className="text-blue-500" />}</div></th>
                                            <th className="py-4 px-6 w-32 cursor-pointer hover:text-white select-none transition-colors" onClick={() => handleSort('name')}><div className="flex items-center gap-1">名稱{sortConfig.key === 'name' && <ArrowUpDown size={12} className="text-blue-500" />}</div></th>
                                            {/* 產業欄位移到這裡 */}
                                            <th className="py-4 px-6 w-32 hidden md:table-cell">產業</th>
                                            <th className="py-4 px-6">符合條件</th>
                                            <th className="py-4 px-6 w-24 text-right">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-white/5">
                                        {displayLogs.length === 0 ? (
                                            <tr><td colSpan="10" className="py-24 text-center text-slate-600 flex flex-col items-center justify-center gap-4">
                                                <div className="p-4 bg-slate-800/50 rounded-full"><Search size={32} className="text-slate-600"/></div>
                                                <span>暫無資料</span>
                                            </td></tr>
                                        ) : (
                                            displayLogs.map((group) => (
                                                <tr key={`${group.date}-${group.code}`} className="hover:bg-white/5 transition-colors group">
                                                    <td className="py-4 px-6 text-slate-400 text-sm font-mono font-medium">{group.date}</td>
                                                    <td className="py-4 px-6"><span className="font-mono text-cyan-300 font-bold bg-cyan-950/30 border border-cyan-500/30 px-2 py-1 rounded cursor-pointer hover:bg-cyan-900/50 hover:border-cyan-400/50 transition-all hover:shadow-[0_0_10px_rgba(34,211,238,0.2)]" onClick={() => { setActiveTab('plan'); setPlanCode(group.code); setPlanDate(group.date); if(group.entry) setPlanEntry(group.entry); if(group.stopLoss) setPlanStopLoss(group.stopLoss); if(group.takeProfit) setPlanTakeProfit(group.takeProfit); if(group.exit) setPlanExit(group.exit); setPlanReason(group.reason || ''); setPlanStatus(group.planStatus || 'planning'); setPlanInStock(group.inStock || false); }}>{group.code}</span></td>
                                                    <td className="py-4 px-6 text-white font-black text-lg tracking-wide whitespace-nowrap">{group.name}</td>
                                                    {/* 產業欄位移到這裡 */}
                                                    <td className="py-4 px-6 text-slate-500 text-sm hidden md:table-cell font-medium">{group.industry}</td>
                                                    <td className="py-4 px-6">
                                                        <div className="flex flex-wrap gap-2">
                                                            {group.strategies.map(strat => {
                                                                const stratDef = STRATEGIES.find(s => s.id === strat.strategyId) || { color: 'bg-slate-700', icon: Activity };
                                                                const Icon = stratDef.icon;
                                                                return (
                                                                    <div key={strat.id} className={`flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold border backdrop-blur-md ${stratDef.color} bg-opacity-90 transition-all hover:scale-105`}>
                                                                        <Icon size={12} strokeWidth={3} /> {stratDef.label || strat.strategyLabel}
                                                                        <button onClick={(e) => { e.stopPropagation(); handleDeleteLog(strat.id); }} className="ml-1 opacity-60 hover:opacity-100 hover:bg-black/20 rounded-full p-0.5"><X size={10} strokeWidth={3}/></button>
                                                                    </div>
