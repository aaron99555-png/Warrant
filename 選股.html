                                                            })}
                                                        </div>
                                                    </td>
                                                    <td className="py-4 px-6 text-right">
                                                        <div className="flex items-center justify-end gap-3">
                                                            <button onClick={(e) => { e.stopPropagation(); handleToggleTrackGroup(group.date, group.code, group.isTracked); }} className={`p-2 rounded-lg transition-all ${group.isTracked ? 'text-amber-400 bg-amber-900/20 shadow-[0_0_10px_rgba(251,191,36,0.2)]' : 'text-slate-600 hover:text-amber-400 hover:bg-slate-800'}`}><Star size={18} fill={group.isTracked ? "currentColor" : "none"} /></button>
                                                            <button onClick={(e) => { e.stopPropagation(); handleDeleteGroup(group.date, group.code); }} className="p-2 text-slate-600 hover:text-red-400 hover:bg-red-900/10 rounded-lg transition-all"><Trash2 size={18} /></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Right Column: Sidebar */}
                    <div className="lg:col-span-4 space-y-6 sticky top-24">
                        {/* Stats */}
                        <div className="bg-[#111827] rounded-2xl shadow-xl border border-white/10 p-6">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2">
                                    <PieChart size={18} className="text-blue-500"/>本期條件統計
                                </h3>
                                {filterStrategy.length > 0 && (
                                    <div className="flex items-center gap-3">
                                        <label className="flex items-center gap-1.5 cursor-pointer bg-slate-800/50 px-2 py-1 rounded border border-slate-700/50 hover:bg-slate-800 hover:border-slate-600 transition-all group select-none">
                                            <input 
                                                type="checkbox" 
                                                checked={strictMode} 
                                                onChange={(e) => setStrictMode(e.target.checked)}
                                                className="w-3.5 h-3.5 rounded border-slate-600 bg-slate-900 text-blue-500 focus:ring-offset-0 focus:ring-1 focus:ring-blue-500 cursor-pointer"
                                            />
                                            <span className={`text-[10px] font-bold transition-colors ${strictMode ? 'text-blue-400' : 'text-slate-500 group-hover:text-slate-300'}`}>完全符合</span>
                                        </label>
                                        <button onClick={() => { setFilterStrategy([]); setSelectedStrategies([]); }} className="flex items-center gap-1 text-xs font-bold text-cyan-400 bg-cyan-950/30 px-2.5 py-1.5 rounded-lg border border-cyan-800 hover:bg-cyan-900/50 transition-colors"><RefreshCcw size={12} />清除</button>
                                    </div>
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-3 max-h-[600px] overflow-y-auto custom-scrollbar pr-2">
                                {STRATEGIES.map(strat => {
                                    const count = summaryStats[strat.label];
                                    const isSelected = filterStrategy.includes(strat.label);
                                    return (
                                        <div 
                                            key={strat.id} 
                                            onClick={() => toggleFilterStrategy(strat.label)} 
                                            className={`flex items-center justify-between p-3.5 rounded-xl border transition-all cursor-pointer group relative overflow-hidden ${isSelected ? `${strat.color} border-transparent shadow-[0_0_15px_rgba(255,255,255,0.2)]` : 'bg-[#1F2937] border-white/5 hover:border-slate-600 hover:bg-slate-800'}`}
                                        >
                                            {/* Selected Overlay Effect */}
                                            {isSelected && <div className="absolute inset-0 bg-white/10 mix-blend-overlay"></div>}
                                            
                                            <div className={`flex items-center gap-2 text-[10px] font-bold z-10 ${isSelected ? 'text-white' : 'text-slate-300'}`}>
                                                {/* Checkbox Icon */}
                                                {isSelected ? <CheckSquare size={12} className="text-white fill-white/20"/> : <Square size={12} className="text-slate-600"/>}
                                                <span className="truncate max-w-[80px]" title={strat.label}>{strat.label}</span>
                                            </div>
                                            
                                            <span className={`font-mono font-black text-lg z-10 ${isSelected ? 'text-white' : 'text-slate-500 group-hover:text-white transition-colors'}`}>{count}</span>
                                        </div>
                                    )
                                })}
                            </div>
                        </div>

                        {/* Display Settings */}
                        <div className="bg-[#111827] rounded-2xl shadow-xl border border-white/10 p-6">
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><Filter size={18} className="text-blue-500" />顯示設定</h3>
                            <div className="space-y-4">
                                <div className="flex items-center justify-between bg-[#1F2937] p-2.5 rounded-xl border border-slate-700">
                                    <button onClick={() => adjustDate(setFilterStartDate, filterStartDate, -1)} className="p-2 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors"><ArrowDownCircle size={18} className="rotate-90" /></button>
                                    <div className="date-input-wrapper"><input type="date" value={filterStartDate} onChange={(e) => setFilterStartDate(e.target.value)} className="bg-transparent border-none text-sm font-bold text-center text-white w-28 focus:ring-0 cursor-pointer hover:text-blue-400 transition-colors"/></div>
                                    <span className="text-slate-600 text-xs font-bold">至</span>
                                    <div className="date-input-wrapper"><input type="date" value={filterEndDate} onChange={(e) => setFilterEndDate(e.target.value)} className="bg-transparent border-none text-sm font-bold text-center text-white w-28 focus:ring-0 cursor-pointer hover:text-blue-400 transition-colors"/></div>
                                    <button onClick={() => adjustDate(setFilterEndDate, filterEndDate, 1)} className="p-2 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors"><ArrowDownCircle size={18} className="-rotate-90" /></button>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button onClick={() => setShowTrackedOnly(!showTrackedOnly)} className={`flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold transition-all border ${showTrackedOnly ? 'bg-amber-500 text-white border-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.5)]' : 'bg-[#1F2937] border-slate-700 text-slate-400 hover:bg-slate-800'}`}><Star size={16} fill={showTrackedOnly ? "currentColor" : "none"} />只看追蹤</button>
                                    <button onClick={handleCopy} className="flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white border border-emerald-500/50 rounded-xl text-sm font-bold transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)]"><Copy size={16} />{filterStrategy.length > 0 ? "複製所選" : "複製結果"}</button>
                                </div>
                                <div className="space-y-3 mt-3">
                                    <div className="grid grid-cols-2 gap-3">
                                        <button onClick={handleCopyDuplicates} className="flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white border border-cyan-500/50 rounded-xl text-xs font-bold transition-all shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                                            <Layers size={14} />複製重複清單
                                        </button>
                                        <button onClick={handleCopyChips} className="flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white border border-indigo-500/50 rounded-xl text-xs font-bold transition-all shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                                            <Percent size={14} />複製籌碼集中度
                                        </button>
                                    </div>
                                    <button onClick={handleCopyDayTrade} className="w-full flex items-center justify-center gap-2 py-3 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 text-white border border-amber-500/50 rounded-xl text-xs font-bold transition-all shadow-[0_0_15px_rgba(245,158,11,0.3)]">
                                        <Crosshair size={14} />當沖選股複製
                                    </button>
                                    <div className="grid grid-cols-2 gap-3 pt-3 border-t border-white/10">
                                        <button onClick={handleExport} className="flex items-center justify-center gap-2 py-3 bg-blue-900/20 hover:bg-blue-900/40 text-blue-400 border border-blue-500/30 rounded-xl text-xs font-bold transition-all"><Download size={14} />匯出紀錄</button>
                                        <button onClick={handleImportClick} className="flex items-center justify-center gap-2 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 rounded-xl text-xs font-bold transition-all"><Upload size={14} />匯入紀錄</button>
                                        <input type="file" ref={fileInputRef} onChange={handleImport} accept=".xlsx, .xls" className="hidden" />
                                    </div>
                                    <div className="pt-3 border-t border-white/10">
                                        <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">資料庫</h4>
                                        <button onClick={() => setShowAddStockModal(true)} className="w-full flex items-center justify-center gap-2 py-3 bg-indigo-900/30 hover:bg-indigo-900/50 text-indigo-400 border border-indigo-500/30 rounded-xl text-xs font-bold transition-all">
                                            <Database size={14} /> 新增股號
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );

            // Renders Trade Plan Tab
            const renderPlanView = () => {
                return (
                <section className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
                    {/* Left: Editor & Stats */}
                    <div className="lg:col-span-4 space-y-6">
                        <div ref={editorTopRef} className={`bg-[#111827] rounded-2xl shadow-xl border p-6 transition-colors duration-300 ${editingId ? 'border-amber-500/50 shadow-[0_0_15px_rgba(245,158,11,0.2)]' : 'border-white/10'}`}>
                            {/* ... Editor Content ... */}
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-lg font-bold text-white flex items-center gap-2">
                                    <PenTool size={20} className={editingId ? "text-amber-400" : "text-emerald-400"} />
                                    {editingId ? '編輯模式' : '交易規劃編輯器'}
                                </h3>
                                {editingId && (
                                    <button onClick={clearPlanForm} className="text-xs flex items-center gap-1 text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded-md border border-slate-700">
                                        <RotateCcw size={12} /> 取消編輯
                                    </button>
                                )}
                            </div>
                            
                            <div className="space-y-4 bg-[#1F2937]/50 p-4 rounded-xl border border-slate-700/50">
                                <div className="grid grid-cols-2 gap-3">
                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold mb-1 block pl-1 uppercase">日期</label>
                                        <div className="date-input-wrapper">
                                            <input type="date" value={planDate} onChange={(e) => setPlanDate(e.target.value)} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 outline-none font-mono font-bold cursor-pointer"/>
                                        </div>
                                    </div>
                                    <div className="relative">
                                        <label className="text-[10px] text-slate-400 font-bold mb-1 block pl-1 uppercase">股票代號</label>
                                        <input type="text" value={planCode} onChange={(e) => setPlanCode(e.target.value)} placeholder="代號" className="w-full pl-3 pr-2 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 outline-none font-mono font-bold"/>
                                        {planName && <div className={`absolute right-1 top-[26px] text-[10px] px-1.5 py-0.5 rounded font-bold ${planName === '無資訊' ? 'bg-red-900/50 text-red-400' : 'bg-blue-900/50 text-blue-300'}`}>{planName}</div>}
                                    </div>
                                </div>
                                <div className="space-y-3">
                                    <div><label className="text-[10px] text-slate-400 font-bold mb-1 block pl-1">進場價 (Entry)</label><div className="relative"><input type="number" value={planEntry} onChange={handleEntryChange} className="w-full pl-9 pr-2 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 outline-none font-mono font-bold"/><div className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-slate-700 flex items-center justify-center text-[10px] text-slate-300 font-bold">進</div></div></div>
                                    <div><label className="text-[10px] text-green-500/80 font-bold mb-1 block pl-1">-5%停損 (Stop Loss)</label><div className="relative"><input type="number" value={planStopLoss} onChange={(e) => setPlanStopLoss(e.target.value)} className="w-full pl-9 pr-2 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-green-400 text-sm focus:border-green-500 outline-none font-mono font-bold"/><div className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-green-900/50 flex items-center justify-center text-[10px] text-green-400 font-bold">損</div></div></div>
                                    <div><label className="text-[10px] text-red-400/80 font-bold mb-1 block pl-1">移動停利價 (Trailing)</label><div className="relative"><input type="number" value={planTakeProfit} onChange={(e) => setPlanTakeProfit(e.target.value)} className="w-full pl-9 pr-2 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-red-400 text-sm focus:border-red-500 outline-none font-mono font-bold"/><div className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-red-900/50 flex items-center justify-center text-[10px] text-red-400 font-bold">利</div></div></div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="text-[10px] text-slate-400 font-bold mb-1 block pl-1">出場價 (Exit)</label>
                                            <div className="relative"><input type="number" value={planExit} onChange={(e) => setPlanExit(e.target.value)} className="w-full pl-9 pr-2 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-slate-300 text-sm focus:border-blue-500 outline-none font-mono font-bold"/><div className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-slate-700 flex items-center justify-center text-[10px] text-slate-300 font-bold">出</div></div>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-slate-400 font-bold mb-1 block pl-1">股票張數</label>
                                            <div className="relative"><input type="number" value={planQty} onChange={(e) => setPlanQty(e.target.value)} className="w-full pl-9 pr-2 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-amber-300 text-sm focus:border-amber-500 outline-none font-mono font-bold"/><div className="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-amber-900/50 flex items-center justify-center text-[10px] text-amber-500 font-bold">張</div></div>
                                        </div>
                                    </div>

                                    {/* Warrant Section */}
                                    <div className="border-t border-slate-700 pt-3 mt-3">
                                        <div className="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1"><Zap size={12} className="text-yellow-400" /> 權證交易專區 (選填)</div>
                                        <div className="space-y-3 p-3 bg-slate-950/30 rounded-lg border border-slate-800">
                                            <div className="grid grid-cols-2 gap-2">
                                                <input type="text" value={planWarrantCode} onChange={(e) => setPlanWarrantCode(e.target.value)} placeholder="權證代號" className="px-2 py-1.5 bg-slate-900 border border-slate-700 rounded text-xs text-white outline-none"/>
                                                <input type="text" value={planWarrantNote} onChange={(e) => setPlanWarrantNote(e.target.value)} placeholder="標的" className="px-2 py-1.5 bg-slate-900 border border-slate-700 rounded text-xs text-white outline-none"/>
                                            </div>
                                            <div className="grid grid-cols-3 gap-2">
                                                <input type="number" value={planWarrantEntry} onChange={(e) => setPlanWarrantEntry(e.target.value)} placeholder="買進" className="px-2 py-1.5 bg-slate-900 border border-slate-700 rounded text-xs text-white outline-none"/>
                                                <input type="number" value={planWarrantExit} onChange={(e) => setPlanWarrantExit(e.target.value)} placeholder="賣出" className="px-2 py-1.5 bg-slate-900 border border-slate-700 rounded text-xs text-white outline-none"/>
                                                <input type="number" value={planWarrantQty} onChange={(e) => setPlanWarrantQty(e.target.value)} placeholder="張數" className="px-2 py-1.5 bg-slate-900 border border-slate-700 rounded text-xs text-white outline-none"/>
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-[10px] text-slate-400 font-bold mb-1 block pl-1">進場理由</label>
                                        <textarea 
                                            value={planReason}
                                            onChange={(e) => setPlanReason(e.target.value)}
                                            className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-blue-500 outline-none resize-none placeholder:text-slate-600"
                                            rows={2}
                                            placeholder="紀錄進場原因..."
                                        />
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <input 
                                            type="checkbox" 
                                            id="inStock" 
                                            checked={planInStock} 
                                            onChange={(e) => setPlanInStock(e.target.checked)}
                                            className="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-blue-500"
                                        />
                                        <label htmlFor="inStock" className="text-sm font-bold text-slate-300 select-none cursor-pointer">庫存中</label>
                                    </div>
                                </div>
                                {(planRisk || planReward) && (
                                    <div className="pt-3 border-t border-slate-700 grid grid-cols-2 gap-2 text-xs">
                                        {planRisk && <div className="flex justify-between items-center text-green-400 bg-green-900/10 p-1.5 rounded border border-green-900/30"><span>風險</span><span className="font-mono font-bold">-{Math.abs(planRisk.val).toFixed(1)} ({Math.abs(planRisk.percent)}%)</span></div>}
                                        {planReward && <div className="flex justify-between items-center text-red-400 bg-red-900/10 p-1.5 rounded border border-red-900/30"><span>獲利</span><span className="font-mono font-bold">+{Math.abs(planReward.val).toFixed(1)} ({Math.abs(planReward.percent)}%)</span></div>}
                                        {rrRatio && <div className="col-span-2 flex justify-between items-center bg-blue-900/20 border border-blue-500/30 px-2 py-2 rounded text-blue-300 mt-1 shadow-inner"><span>風報比 (R:R)</span><span className="font-mono font-bold text-sm">1 : {Math.abs(rrRatio)}</span></div>}
                                    </div>
                                )}
                                <button onClick={handleSavePlan} className={`w-full mt-2 bg-gradient-to-r text-white font-bold py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 border border-white/10 ${editingId ? 'from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 shadow-amber-900/20' : 'from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-emerald-900/20'}`}>
                                    <Save size={18} /> {editingId ? '更新交易紀錄' : '新增交易規劃'}
                                </button>
                            </div>
                        </div>

                        {/* Trade Performance Stats */}
                        <div className="bg-[#111827] rounded-2xl shadow-xl border border-white/10 p-6">
                            <h3 className="text-sm font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2"><Trophy size={18} className="text-amber-400" />績效統計 (含權證)</h3>
                            <div className="space-y-4">
                                <div className="flex items-center justify-between bg-[#1F2937] p-2.5 rounded-xl border border-slate-700">
                                    <button onClick={() => adjustDate(setStatsStartDate, statsStartDate, -1)} className="p-2 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors"><ArrowDownCircle size={18} className="rotate-90" /></button>
                                    <div className="date-input-wrapper"><input type="date" value={statsStartDate} onChange={(e) => setStatsStartDate(e.target.value)} className="bg-transparent border-none text-sm font-bold text-center text-white w-28 focus:ring-0 cursor-pointer hover:text-blue-400 transition-colors"/></div>
                                    <span className="text-slate-600 text-xs font-bold">至</span>
                                    <div className="date-input-wrapper"><input type="date" value={statsEndDate} onChange={(e) => setStatsEndDate(e.target.value)} className="bg-transparent border-none text-sm font-bold text-center text-white w-28 focus:ring-0 cursor-pointer hover:text-blue-400 transition-colors"/></div>
                                    <button onClick={() => adjustDate(setStatsEndDate, statsEndDate, 1)} className="p-2 hover:bg-slate-700 rounded-lg text-slate-400 hover:text-white transition-colors"><ArrowDownCircle size={18} className="-rotate-90" /></button>
                                </div>
                                
                                <div className="bg-gradient-to-br from-[#1F2937] to-slate-900 p-4 rounded-xl border border-slate-700 relative overflow-hidden group">
                                     <div className={`absolute top-0 right-0 p-8 opacity-10 ${planStats.totalProfitAmount >= 0 ? 'text-red-500' : 'text-green-500'}`}><Coins size={80} /></div>
                                     <div className="relative z-10">
                                         <div className="text-xs text-slate-400 font-bold uppercase mb-2">總獲利金額 (已平倉)</div>
                                         <div className={`text-3xl font-black font-mono tracking-tight ${planStats.totalProfitAmount >= 0 ? 'text-red-400' : 'text-green-400'}`}>
                                            <span className="text-sm mr-1">$</span>{planStats.totalProfitAmount.toLocaleString()}
                                         </div>
                                     </div>
                                </div>

                                <div className="grid grid-cols-2 gap-2 text-center">
                                    <div className="bg-[#1F2937] p-3 rounded-xl border border-slate-700">
                                        <div className="text-[10px] text-slate-400 font-bold uppercase mb-1">已平倉交易</div>
                                        <div className="text-xl font-black text-white">{planStats.closedTrades} <span className="text-xs text-slate-500 font-normal">/ {planStats.totalTrades}</span></div>
                                    </div>
                                    <div className="bg-[#1F2937] p-3 rounded-xl border border-slate-700">
                                        <div className="text-[10px] text-slate-400 font-bold uppercase mb-1">勝率</div>
                                        <div className="text-xl font-black text-amber-400">{planStats.winRate}%</div>
                                    </div>
                                </div>
                                <div className="bg-[#1F2937] p-4 rounded-xl border border-slate-700 relative overflow-hidden">
                                     <div className="relative z-10">
                                         <div className="text-xs text-slate-400 font-bold uppercase mb-2">累積 ROI (股票)</div>
                                         <div className={`text-2xl font-black font-mono tracking-tight ${parseFloat(planStats.totalROI) >= 0 ? 'text-red-400' : 'text-green-400'}`}>
                                            {parseFloat(planStats.totalROI) > 0 ? '+' : ''}{planStats.totalROI}%
                                         </div>
                                         <div className="text-[10px] text-slate-500 mt-1 font-medium">平均每筆: {planStats.avgROI}%</div>
                                     </div>
                                </div>

                                {/* Integrated Data Management Buttons */}
                                <div className="pt-4 mt-2 border-t border-slate-700/50">
                                     <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-3">資料管理</h4>
                                     <div className="grid grid-cols-2 gap-3">
                                        <button onClick={handleExport} className="flex items-center justify-center gap-2 py-3 bg-blue-900/20 hover:bg-blue-900/40 text-blue-400 border border-blue-500/30 rounded-xl text-xs font-bold transition-all"><Download size={14} />匯出紀錄</button>
                                        <button onClick={handleImportClick} className="flex items-center justify-center gap-2 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 rounded-xl text-xs font-bold transition-all"><Upload size={14} />匯入紀錄</button>
                                     </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Right: List */}
                    <div className="lg:col-span-8 bg-[#111827] rounded-2xl shadow-xl border border-white/10 overflow-hidden min-h-[600px] overflow-x-auto">
                         <div className="p-5 border-b border-white/10 flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/50 min-w-[800px]">
                            <div className="flex items-center gap-3">
                                 <h3 className="font-bold text-white flex items-center gap-2"><ClipboardList size={20} className="text-blue-400"/> 交易規劃紀錄表</h3>
                                 <span className="text-xs text-slate-500 font-mono bg-slate-900 px-2 py-0.5 rounded border border-slate-800">
                                    {logsWithPlans.length} 筆
                                 </span>
                            </div>
                            
                            <div className="flex items-center gap-2 bg-slate-800/80 p-1.5 rounded-lg border border-slate-700/50 shadow-sm">
                                 {/* ... Date Filter ... */}
                                 <div className="flex items-center gap-2 px-2 border-r border-slate-700/50">
                                     <CalendarRange size={14} className="text-blue-400"/>
                                     <input 
                                        type="date" 
                                        value={filterStartDate} 
                                        onChange={(e) => setFilterStartDate(e.target.value)} 
                                        className="bg-transparent border-none text-xs text-slate-200 font-mono focus:ring-0 p-0 w-[88px] cursor-pointer" 
                                     />
                                     <span className="text-slate-500 text-xs">to</span>
                                     <input 
                                        type="date" 
                                        value={filterEndDate} 
                                        onChange={(e) => setFilterEndDate(e.target.value)} 
                                        className="bg-transparent border-none text-xs text-slate-200 font-mono focus:ring-0 p-0 w-[88px] cursor-pointer" 
                                     />
                                 </div>
                                 
                                 <select 
                                    onChange={handleDateRangeSelect}
                                    className="bg-transparent border-none text-xs text-amber-400 font-bold focus:ring-0 cursor-pointer p-0 px-2 hover:text-amber-300 transition-colors"
                                    style={{backgroundImage: 'none'}}
                                    defaultValue=""
                                 >
                                    <option value="" disabled>快速篩選</option>
                                    <option value="7" className="bg-slate-800 text-slate-200">近 7 日</option>
                                    <option value="30" className="bg-slate-800 text-slate-200">近 30 日</option>
                                    <option value="60" className="bg-slate-800 text-slate-200">近 60 日</option>
                                    <option value="180" className="bg-slate-800 text-slate-200">近 180 日</option>
                                 </select>
                            </div>
                         </div>
                         <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-950/80 text-blue-300 text-xs font-bold uppercase tracking-wider border-b border-white/10">
                                        <th className="py-3 px-1 w-20">日期</th>
                                        <th className="py-3 px-1 w-16">代號</th>
                                        <th className="py-3 px-1 w-20">名稱</th>
                                        <th className="py-3 px-1 text-center bg-slate-900/50 w-24">股票進出</th>
                                        <th className="py-3 px-1 text-center bg-slate-900/50 w-16">移動停利</th>
                                        <th className="py-3 px-1 text-center bg-slate-800/80 border-l border-white/10 w-16">現價</th>
                                        <th className="py-3 px-1 text-center bg-slate-900/50 w-12">張</th>
                                        <th className="py-3 px-1 text-center bg-slate-900/50 w-20">股損益</th>
                                        
                                        <th className="py-3 px-1 text-center bg-yellow-900/10 border-l border-white/5 w-24">權證代號</th>
                                        <th className="py-3 px-1 text-center bg-yellow-900/10 w-24">權證進出</th>
                                        <th className="py-3 px-1 text-center bg-yellow-900/10 w-16 border-l border-white/5">權證現價</th>
                                        <th className="py-3 px-1 text-center bg-yellow-900/10 w-12">張</th>
                                        <th className="py-3 px-1 text-center bg-yellow-900/10 w-20">權損益</th>

                                        <th className="py-3 px-1 text-center bg-slate-900/20 w-24 border-l border-white/10 font-black text-white">單筆總益</th>
                                        
                                        <th className="py-3 px-1 w-14 text-center">庫存</th>
                                        <th className="py-3 px-1 w-16 text-right">操作</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-white/5">
                                    {logsWithPlans.length === 0 ? (
                                        <tr><td colSpan="16" className="py-24 text-center text-slate-600">
                                            <div className="flex flex-col items-center gap-3">
                                                <div className="p-3 bg-slate-800/50 rounded-full"><FileText size={28} className="text-slate-700"/></div>
                                                <span>在此區間無規劃紀錄</span>
                                            </div>
                                        </td></tr>
                                    ) : (
                                        logsWithPlans.map(log => {
                                            // Stock Calc
                                            let stockProfit = 0;
                                            let isRealized = false;
                                            
                                            const entry = parseFloat(log.entry);
                                            const exit = log.exit ? parseFloat(log.exit) : null;
                                            const current = log.currentPrice ? parseFloat(log.currentPrice) : null;
                                            const qty = parseFloat(log.qty || 0);
                                            const sl = log.stopLoss ? parseFloat(log.stopLoss) : 0;
                                            const isShort = sl > entry; 

                                            if (log.entry && exit !== null) {
                                                stockProfit = isShort ? (entry - exit) * 1000 * qty : (exit - entry) * 1000 * qty;
                                                isRealized = true;
                                            } else if (log.entry && current !== null) {
                                                stockProfit = isShort ? (entry - current) * 1000 * qty : (current - entry) * 1000 * qty;
                                            }

                                            // Warrant Calc
                                            let warrantProfit = 0;
                                            let isWarrantRealized = false;
                                            
                                            const warrantEntry = parseFloat(log.warrantEntry);
                                            const warrantExit = log.warrantExit ? parseFloat(log.warrantExit) : null;
                                            const warrantCurrent = log.warrantCurrentPrice ? parseFloat(log.warrantCurrentPrice) : null;
                                            const warrantQty = parseFloat(log.warrantQty || 0);

                                            if (log.warrantEntry && (warrantExit !== null || warrantCurrent !== null) && warrantQty > 0) {
                                                if (warrantExit !== null) {
                                                    warrantProfit = (warrantExit - warrantEntry) * 1000 * warrantQty;
                                                    isWarrantRealized = true;
                                                } else if (warrantCurrent !== null) {
                                                    warrantProfit = (warrantCurrent - warrantEntry) * 1000 * warrantQty;
                                                }
                                            }

                                            const totalRowProfit = stockProfit + warrantProfit;
                                            const hasProfitData = (log.entry && (exit !== null || current !== null)) || (log.warrantEntry && (warrantExit !== null || warrantCurrent !== null));
                                            const isFullyRealized = (log.entry ? isRealized : true) && (log.warrantEntry ? isWarrantRealized : true);

                                            return (
                                                <tr key={log.id} className={`hover:bg-white/5 transition-colors text-xs ${editingId === log.id ? 'bg-blue-900/10 border-l-2 border-blue-500' : ''}`}>
                                                    <td className="py-3 px-1 text-slate-400 font-mono">{log.date}</td>
                                                    <td className="py-3 px-1 font-mono text-cyan-300 font-bold">{log.code}</td>
                                                    <td className="py-3 px-1 text-white font-bold max-w-[80px] truncate" title={log.name}>{log.name}</td>
                                                    
                                                    {/* Stock Columns */}
                                                    <td className="py-3 px-1 text-center bg-slate-900/30">
                                                        <div className="flex flex-col gap-0.5">
                                                            <span className="text-[10px] text-slate-400">進: {log.entry || '-'}</span>
                                                            <span className="text-[10px] text-slate-300">出: {log.exit || '-'}</span>
                                                        </div>
                                                    </td>
                                                    <td className="py-3 px-1 text-center font-mono text-red-400 bg-slate-900/30">
                                                        {log.takeProfit || '-'}
                                                    </td>
                                                    <td className="py-3 px-1 text-center bg-slate-800/80 border-l border-white/5">
                                                        <input 
                                                            type="number" 
                                                            className="w-14 bg-slate-900 border border-slate-600 rounded px-1 text-right text-white focus:border-blue-500 outline-none text-xs font-mono font-bold py-1"
                                                            placeholder="-"
                                                            value={log.currentPrice || ''}
                                                            onClick={(e) => e.stopPropagation()}
                                                            onChange={(e) => handleUpdateLogField(log.id, 'currentPrice', e.target.value)}
                                                        />
                                                    </td>
                                                    <td className="py-3 px-1 text-center font-mono font-bold text-amber-300 bg-slate-900/30">{log.qty || '0'}</td>
                                                    <td className="py-3 px-1 text-center bg-slate-900/30 relative group/profit">
                                                        {stockProfit !== 0 ? (
                                                            <span className={`font-mono font-bold ${stockProfit >= 0 ? 'text-red-400' : 'text-green-400'} ${!isRealized ? 'opacity-90 italic' : ''}`}>
                                                                {stockProfit.toLocaleString()}
                                                            </span>
                                                        ) : '-'}
                                                        {!isRealized && stockProfit !== 0 && (
                                                            <div className="absolute top-0 right-0 w-2 h-2 bg-blue-500 rounded-full animate-pulse" title="預估損益 (未平倉)"></div>
                                                        )}
                                                    </td>

                                                    {/* Warrant Columns (Purple Theme) */}
                                                    <td className="py-3 px-1 text-center font-mono text-purple-400 bg-purple-900/10 border-l border-white/5">
                                                        {log.warrantCode ? (
                                                            <div className="flex flex-col">
                                                                <span>{log.warrantCode}</span>
                                                                {log.warrantNote && <span className="text-[9px] text-slate-500 truncate max-w-[60px]">{log.warrantNote}</span>}
                                                            </div>
                                                        ) : '-'}
                                                    </td>
                                                    <td className="py-3 px-1 text-center bg-purple-900/10">
                                                         {log.warrantCode ? (
                                                            <div className="flex flex-col gap-0.5">
                                                                <span className="text-[10px] text-slate-400">進: {log.warrantEntry || '-'}</span>
                                                                <span className="text-[10px] text-slate-300">出: {log.warrantExit || '-'}</span>
                                                            </div>
                                                        ) : '-'}
                                                    </td>
                                                    <td className="py-3 px-1 text-center bg-purple-900/10 border-l border-white/5">
                                                        {log.warrantCode ? (
                                                            <input 
                                                                type="number" 
                                                                className="w-14 bg-slate-900 border border-purple-500/20 rounded px-1 text-right text-purple-100 focus:border-purple-500 outline-none text-xs font-mono font-bold py-1"
                                                                placeholder="-"
                                                                value={log.warrantCurrentPrice || ''}
                                                                onClick={(e) => e.stopPropagation()}
                                                                onChange={(e) => handleUpdateLogField(log.id, 'warrantCurrentPrice', e.target.value)}
                                                            />
                                                        ) : '-'}
                                                    </td>
                                                    <td className="py-3 px-1 text-center font-mono text-slate-300 bg-purple-900/10">{log.warrantQty || '-'}</td>
                                                    <td className="py-3 px-1 text-center bg-purple-900/10 relative">
                                                        {warrantProfit !== 0 ? (
                                                            <span className={`font-mono font-bold ${warrantProfit >= 0 ? 'text-red-400' : 'text-green-400'} ${!isWarrantRealized ? 'opacity-90 italic' : ''}`}>
                                                                {warrantProfit.toLocaleString()}
                                                            </span>
                                                        ) : '-'}
                                                        {!isWarrantRealized && warrantProfit !== 0 && (
                                                            <div className="absolute top-0 right-0 w-2 h-2 bg-yellow-500 rounded-full animate-pulse" title="預估損益 (未平倉)"></div>
                                                        )}
                                                    </td>

                                                    {/* Total Row Profit */}
                                                    <td className="py-3 px-1 text-center bg-slate-900/20 border-l border-white/10">
                                                        {hasProfitData ? (
                                                            <span className={`font-mono font-black text-sm ${totalRowProfit >= 0 ? 'text-red-400' : 'text-green-400'} ${!isFullyRealized ? 'italic opacity-90' : ''}`}>
                                                                {totalRowProfit.toLocaleString()}
                                                            </span>
                                                        ) : '-'}
                                                    </td>

                                                    <td className="py-3 px-1 text-center">
                                                        <button 
                                                            onClick={(e) => {
                                                                e.stopPropagation();
                                                                const newLogs = logs.map(l => l.id === log.id ? { ...l, inStock: !l.inStock } : l);
                                                                setLogs(newLogs);
                                                            }}
                                                            className={`inline-flex items-center px-1.5 py-0.5 rounded text-[9px] font-bold transition-all cursor-pointer ${
                                                                log.inStock 
                                                                ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/50' 
                                                                : 'text-slate-600 border border-slate-800'
                                                            }`}
                                                        >
                                                            {log.inStock ? '持倉' : '空手'}
                                                        </button>
                                                    </td>
                                                    <td className="py-3 px-1 text-right">
                                                        <div className="flex items-center justify-end gap-1">
                                                            <button 
                                                                onClick={() => {
                                                                    // Set Editing ID
                                                                    setEditingId(log.id);
                                                                    
                                                                    setPlanCode(log.code);
                                                                    setPlanDate(log.date);
                                                                    setPlanEntry(log.entry || '');
                                                                    setPlanStopLoss(log.stopLoss || '');
                                                                    setPlanTakeProfit(log.takeProfit || '');
                                                                    setPlanExit(log.exit || '');
                                                                    setPlanQty(log.qty || 0);
                                                                    setPlanReason(log.reason || '');
                                                                    setPlanStatus(log.planStatus || 'planning');
                                                                    setPlanInStock(log.inStock || false);
                                                                    
                                                                    // Load Warrant Data
                                                                    setPlanWarrantCode(log.warrantCode || '');
                                                                    setPlanWarrantNote(log.warrantNote || '');
                                                                    setPlanWarrantEntry(log.warrantEntry || '');
                                                                    setPlanWarrantExit(log.warrantExit || '');
                                                                    setPlanWarrantQty(log.warrantQty || '');
                                                                    
                                                                    if (editorTopRef.current) {
                                                                        window.scrollTo({
                                                                            top: editorTopRef.current.offsetTop - 100, 
                                                                            behavior: 'smooth'
                                                                        });
                                                                    }
                                                                }}
                                                                className={`p-1.5 rounded transition-colors ${editingId === log.id ? 'bg-amber-500 text-white shadow-lg shadow-amber-500/30' : 'hover:bg-slate-700 text-blue-400'}`}
                                                                title="編輯"
                                                            >
                                                                <PenTool size={14} />
                                                            </button>
                                                            <button 
                                                                onClick={(e) => { 
                                                                    e.stopPropagation(); 
                                                                    handleDeleteLog(log.id); 
                                                                }} 
                                                                className="p-1.5 hover:bg-slate-700 text-slate-500 hover:text-red-400 rounded transition-colors"
                                                                title="刪除"
                                                            >
                                                                <Trash2 size={14} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                         </div>
                    </div>
                </section>
                );
            };

            return (
                <div className="min-h-screen bg-[#0B1121] text-slate-100 font-sans pb-20 selection:bg-fuchsia-500/30 relative">
                    
                    {/* Add Custom Stock Modal (Restored) */}
                    {showAddStockModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
                            <div className="bg-[#111827] border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 animate-bounce-in ring-1 ring-white/10">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3 text-indigo-400">
                                        <Database size={24} className="drop-shadow-[0_0_10px_rgba(99,102,241,0.5)]"/>
                                        <h3 className="text-lg font-bold text-white tracking-wide">新增自訂股票</h3>
                                    </div>
                                    <button onClick={() => setShowAddStockModal(false)} className="text-slate-500 hover:text-white"><X size={20}/></button>
                                </div>
                                
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-400 font-bold mb-1 block pl-1">股票代號</label>
                                        <input type="text" value={newStockCode} onChange={(e) => setNewStockCode(e.target.value)} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-indigo-500 outline-none font-mono font-bold" placeholder="例如: 00940"/>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 font-bold mb-1 block pl-1">股票名稱</label>
                                        <input type="text" value={newStockName} onChange={(e) => setNewStockName(e.target.value)} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-indigo-500 outline-none" placeholder="例如: 元大台灣價值高息"/>
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 font-bold mb-1 block pl-1">產業類別 (選填)</label>
                                        <input type="text" value={newStockIndustry} onChange={(e) => setNewStockIndustry(e.target.value)} className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white text-sm focus:border-indigo-500 outline-none" placeholder="例如: ETF"/>
                                    </div>
                                </div>

                                <button onClick={handleAddCustomStock} className="w-full py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-bold transition-colors shadow-lg shadow-indigo-900/30">
                                    加入資料庫
                                </button>

                                {/* List of custom stocks */}
                                {Object.keys(customStocks).length > 0 && (
                                    <div className="pt-4 mt-2 border-t border-white/10">
                                        <div className="text-xs font-bold text-slate-500 mb-2">已自訂股票 ({Object.keys(customStocks).length})</div>
                                        <div className="max-h-32 overflow-y-auto space-y-1 custom-scrollbar pr-1">
                                            {Object.entries(customStocks).map(([code, data]) => (
                                                <div key={code} className="flex items-center justify-between text-xs bg-slate-900/50 p-2 rounded border border-slate-800">
                                                    <div className="flex gap-2">
                                                        <span className="font-mono text-indigo-300 font-bold">{code}</span>
                                                        <span className="text-slate-300">{data.name}</span>
                                                    </div>
                                                    <button onClick={() => handleDeleteCustomStock(code)} className="text-slate-600 hover:text-red-400"><Trash2 size={12}/></button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Confirm Modal */}
                    {confirmModal.show && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md">
                            <div className="bg-[#111827] border border-white/10 rounded-2xl p-6 w-full max-w-sm shadow-2xl space-y-4 animate-bounce-in ring-1 ring-white/10">
                                <div className="flex items-center gap-3 text-amber-500 mb-2">
                                    <AlertTriangle size={28} className="drop-shadow-[0_0_10px_rgba(245,158,11,0.5)]"/>
                                    <h3 className="text-xl font-bold text-white tracking-wide">{confirmModal.title}</h3>
                                </div>
                                <p className="text-slate-300 leading-relaxed font-medium">{confirmModal.message}</p>
                                <div className="flex gap-3 justify-end pt-4">
                                    <button 
                                        onClick={() => setConfirmModal({ ...confirmModal, show: false })} 
                                        className="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition-colors border border-white/5"
                                    >
                                        取消
                                    </button>
                                    <button 
                                        onClick={confirmModal.onConfirm} 
                                        className="px-4 py-2 rounded-lg bg-gradient-to-r from-red-600 to-rose-600 text-white hover:from-red-500 hover:to-rose-500 transition-colors font-bold shadow-lg shadow-red-900/30 border border-red-500/30"
                                    >
                                        確認執行
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className={`fixed top-6 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-2xl backdrop-blur-md border flex items-center gap-3 animate-fade-in-down transition-all
                        ${toast.type === 'success' ? 'bg-emerald-600/90 border-emerald-400 text-white shadow-[0_0_20px_rgba(16,185,129,0.4)]' : 'bg-red-600/90 border-red-400 text-white shadow-[0_0_20px_rgba(239,68,68,0.4)]'}`}>
                        {toast.type === 'success' ? <CheckCircle2 size={20} /> : <AlertCircle size={20} />}
                        <span className="font-bold tracking-wide">{toast.message}</span>
                        </div>
                    )}

                    <header className="bg-[#0B1121]/80 border-b border-white/10 backdrop-blur-xl sticky top-0 z-30 shadow-2xl">
                        <div className="w-[98%] max-w-[2400px] mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-4 group">
                            <div className="bg-gradient-to-br from-cyan-500 via-blue-600 to-purple-600 p-2.5 rounded-xl shadow-[0_0_20px_rgba(59,130,246,0.5)] group-hover:scale-105 transition-transform duration-300">
                            <Activity size={24} className="text-white" />
                            </div>
                            <h1 className="text-2xl font-artistic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-white via-blue-200 to-cyan-300 drop-shadow-sm">
                            萊恩交易手札
                            </h1>
                        </div>
                        
                        {/* Navigation Tabs */}
                        <div className="flex bg-[#1F2937] p-1.5 rounded-xl border border-white/5">
                            <button 
                                onClick={() => setActiveTab('journal')}
                                className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${activeTab === 'journal' ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-900/50' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                            >
                                <BookOpen size={16} /> 選股日誌
                            </button>
                            <button 
                                onClick={() => setActiveTab('plan')}
                                className={`px-5 py-2.5 rounded-lg text-sm font-bold transition-all flex items-center gap-2 ${activeTab === 'plan' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-900/50' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}
                            >
                                <ClipboardList size={16} /> 交易規劃紀錄
                            </button>
                        </div>

                        <div className="flex items-center gap-4 text-sm font-medium">
                            <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#1F2937] border border-slate-700 shadow-inner">
                                <Target size={14} className="text-cyan-400"/>
                                <span className="text-slate-300">筆數:</span>
                                <span className="text-white font-mono font-bold">{activeTab === 'journal' ? displayLogs.length : logsWithPlans.length}</span>
                            </div>
                            {activeTab === 'journal' && (
                                <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#1F2937] border border-slate-700 shadow-inner">
                                    <Star size={14} className="text-amber-400 fill-amber-400 animate-pulse"/>
                                    <span className="text-slate-300">追蹤清單:</span>
                                    <span className="text-amber-400 font-mono font-bold">{trackedCount}</span>
                                </div>
                            )}
                        </div>
                        </div>
                    </header>

                    <main className="w-[98%] max-w-[2400px] mx-auto p-4 md:p-6 space-y-8">
                        {activeTab === 'journal' ? renderJournalView() : renderPlanView()}
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<RyanStockJournal />);
    </script>
</body>
</html>
